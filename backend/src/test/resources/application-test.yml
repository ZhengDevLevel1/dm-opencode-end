spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:flower_shop;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  main:
    banner-mode: off

app:
  jwt:
    secret: flower-shop-test-secret-key-at-least-32-bytes-long
    expiration-seconds: 3600
    issuer: flower-shop-test
  redis:
    enabled: false
  recommendation:
    candidate-limit: 60

logging:
  level:
    root: warn
    com.flower.mall: info
    org.springframework: warn
