server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: flower-shop-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/flower_shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 500ms
      lettuce:
        shutdown-timeout: 100ms
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  sql:
    init:
      mode: never
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  # 邮件服务（QQ 邮箱 SMTP），用于登录/注册邮箱验证码；账号与授权码可用环境变量覆盖
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  packages-to-scan: com.flower.mall.module

knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: 接口模型

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-seconds: ${JWT_EXPIRATION:86400}
    issuer: flower-shop-backend
  redis:
    enabled: ${APP_REDIS_ENABLED:true}
  cache:
    product-detail-seconds: 600
    hot-products-seconds: 300
    hot-products-limit: 8
  recommendation:
    candidate-limit: 60
    catalog-scan-limit: 500
    product-cache-seconds: 30
    behavior-cache-seconds: 30
  ai:
    enabled: ${APP_AI_ENABLED:true}
    chat-enabled: ${APP_AI_CHAT_ENABLED:true}
    merchant-enabled: ${APP_AI_MERCHANT_ENABLED:true}
    chat-allow-anonymous: ${APP_AI_CHAT_ALLOW_ANONYMOUS:true}
    base-url: ${AI_BASE_URL:http://127.0.0.1:8081}
    nacos-enabled: ${NACOS_ENABLED:false}
    nacos-server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    service-name: ${AI_SERVICE_NAME:flower-ai-service}
    internal-token: ${AI_INTERNAL_TOKEN:flower-ai-internal-dev-token}
    timeout-ms: ${APP_AI_TIMEOUT_MS:15000}
    chat-timeout-ms: ${APP_AI_CHAT_TIMEOUT_MS:60000}
    chat-rate-limit-per-minute: ${APP_AI_CHAT_RATE_LIMIT:10}
    chat-daily-limit: ${APP_AI_CHAT_DAILY_LIMIT:100}
    chat-max-question-chars: ${APP_AI_CHAT_MAX_QUESTION_CHARS:500}
    chat-context-max-chars: ${APP_AI_CHAT_CONTEXT_MAX_CHARS:12000}
    chat-context-max-messages: ${APP_AI_CHAT_CONTEXT_MAX_MESSAGES:40}
    daily-budget: ${APP_AI_DAILY_BUDGET:20.0}
    chat-model: ${DEEPSEEK_CHAT_MODEL:deepseek-chat}
    recommendation-mode: ${APP_AI_RECOMMENDATION_MODE:TF_IDF}
    vector-traffic-percent: ${APP_AI_VECTOR_TRAFFIC_PERCENT:0}
    pricing:
      input-per-1k: ${APP_AI_PRICE_INPUT_PER_1K:0.001}
      output-per-1k: ${APP_AI_PRICE_OUTPUT_PER_1K:0.002}
  # MinIO 图片上传；本地未启动 MinIO 时保持 enabled=false
  minio:
    enabled: ${MINIO_ENABLED:true}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:flower-shop}
    # 对象公开访问前缀（需包含 bucket）；留空时自动使用 endpoint/bucket，使用 CDN 时填写完整前缀
    public-url: ${MINIO_PUBLIC_URL:}
    auto-create-bucket: ${MINIO_AUTO_CREATE_BUCKET:true}
    public-read: ${MINIO_PUBLIC_READ:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  config: classpath:logback-spring.xml
  level:
    com.flower.mall: debug
